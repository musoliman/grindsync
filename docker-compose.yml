services:
  grindsync:
    build: .
    env_file: .env
    environment:
      # Paths inside the container; overrides the host path from .env
      OBSIDIAN_VAULT_PATH: /vault
      STATE_FILE: /data/state.json
    volumes:
      - ./data:/data
      # Host path to your Obsidian vault
      - ${OBSIDIAN_VAULT_PATH:?set OBSIDIAN_VAULT_PATH in .env}:/vault
